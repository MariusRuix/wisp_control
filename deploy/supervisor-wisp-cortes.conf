; /etc/supervisor/conf.d/wisp-cortes.conf
; sudo supervisorctl reread && sudo supervisorctl update
[program:wisp-cortes-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/wisp-cortes/artisan queue:work --queue=smartolt,default --sleep=3 --tries=5 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/wisp-cortes/storage/logs/worker.log
stopwaitsecs=3600

; Cron del sistema (crontab -e -u www-data):
; * * * * * cd /var/www/wisp-cortes && php artisan schedule:run >> /dev/null 2>&1
